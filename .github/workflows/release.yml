name: Release

# Triggered when the version in src/harbor/__init__.py changes on main.
on:
  push:
    branches: [main]
    paths:
      - "src/harbor/__init__.py"

permissions:
  contents: write # needed to push the tag and create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-finished release

jobs:
  # Read the new version and bail out early if its tag already exists,
  # so unrelated edits to __init__.py don't produce duplicate releases.
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so we can see existing tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract version
        id: version
        run: |
          VERSION=$(python -c "
          import re
          src = open('src/harbor/__init__.py', encoding='utf-8').read()
          m = re.search(r'^__version__\s*=\s*[\"']([^\"']+)[\"']', src, re.M)
          if not m:
              raise SystemExit('could not find __version__')
          print(m.group(1))
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check whether tag already exists
        id: check
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::tag $TAG already exists — skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test before release (Python ${{ matrix.python-version }})
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make dev PYTHON=python

      - name: Run tests with coverage
        run: make coverage PYTHON=python

  release:
    name: Tag & Publish
    needs: [prepare, test]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: make build PYTHON=python

      - name: Verify version matches package metadata
        run: |
          INSTALLED=$(pip install dist/*.whl --target /tmp/pkgcheck --quiet && \
            python -c "
          import sys; sys.path.insert(0, '/tmp/pkgcheck')
          from harbor import __version__
          print(__version__)
          ")
          EXPECTED="${{ needs.prepare.outputs.version }}"
          if [ "$INSTALLED" != "$EXPECTED" ]; then
            echo "::error::wheel reports $INSTALLED but expected $EXPECTED"
            exit 1
          fi

      - name: Create and push tag
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: dist/*
