name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

# Cancel in-progress runs on the same ref (e.g. rapid PR pushes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + JS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff check
        run: make lint PYTHON=python

      - name: JS syntax check
        run: node --check src/harbor/static/harbor-utils.js

      # JS unit tests are OS/Python-independent, so run them once here
      # instead of repeating them in every test matrix job.
      - name: Run frontend JS tests
        run: node tests/frontend/test-utils.js

  build:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build and check package
        run: make build-check PYTHON=python

  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full Python version range on Linux (fastest, primary platform)
          - { os: ubuntu-latest, python-version: "3.9" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: ubuntu-latest, python-version: "3.14" }
          # Cross-platform coverage on a single Python version — OS-specific
          # issues are independent of the Python version.
          - { os: macos-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.13" }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make dev PYTHON=python

      # Single pass: coverage runs the full test suite, so a separate
      # `make test` step would just duplicate the work.
      - name: Run tests with coverage
        run: make coverage PYTHON=python
