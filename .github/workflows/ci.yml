name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

# Default: minimum permissions; elevate per-job if needed
permissions:
  contents: read

# Cancel in-progress runs on the same ref (e.g. rapid PR pushes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + JS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff check
        run: make lint PYTHON=python

      - name: JS syntax check
        run: node --check src/harbor/static/harbor-utils.js

      # JS unit tests are OS/Python-independent, so run them once here
      # instead of repeating them in every test matrix job.
      - name: Run frontend JS tests
        run: node tests/frontend/test-utils.js

  build:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build and check package
        run: make build-check PYTHON=python

  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full Python version range on Linux (fastest, primary platform)
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          # Cross-platform coverage on 3.12 (main dev version) — OS-specific
          # issues are independent of the Python version.
          - { os: macos-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.12" }

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make dev PYTHON=python

      # Single pass: coverage runs the full test suite, so a separate
      # `make test` step would just duplicate the work.
      #
      # shell: bash on every OS. The Makefile recipes are POSIX shell
      # (`VAR=value cmd ...`), and on Windows the default pwsh wrapper runs with
      # $ErrorActionPreference='stop', which can fail the step on stderr output
      # even when make itself exits 0.
      - name: Run tests with coverage
        shell: bash
        run: |
          set +e
          make coverage PYTHON=python
          status=$?
          echo "make coverage exited with status=$status"
          exit $status

  # E2E browser tests — one Linux + one Python version is enough.  They
  # exercise real browser behavior (login, batch actions, discard) rather than
  # Python-version/OS portability, which the `test` matrix already covers.
  #
  # Runs inside the official Playwright Python image: Python 3.12 + Chromium +
  # every system library baked in, so no apt installs and no browser download
  # are needed.  The tag MUST stay in sync with the pinned `playwright` version
  # in pyproject.toml (both v1.62.0) — on a mismatch `playwright install` would
  # silently re-download the browser and the image's cache is wasted.
  e2e:
    name: E2E (browser)
    needs: [lint]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The image has no `make`, so these inline the Makefile recipes they
      # mirror (make dev / make e2e-setup / make test-e2e) to keep the job
      # apt-free.  The image Python is system-wide and not PEP 668-managed,
      # so a plain editable install works.
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      # Browsers ship in the image (PLAYWRIGHT_BROWSERS_PATH=/ms-playwright),
      # so this is a fast no-op that only downloads if versions ever drift.
      - name: Verify Playwright Chromium
        run: python -m playwright install chromium

      - name: Run e2e tests
        run: PYTHONPATH=src python -m pytest tests/e2e/ -m e2e --browser chromium
