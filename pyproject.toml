[project]
name = "harbor"
dynamic = ["version"]
description = "A local web dashboard for managing multiple git repositories at once."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "tomli>=1.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/ginkgohat/harbor"
Repository = "https://github.com/ginkgohat/harbor"

[project.scripts]
harbor = "harbor.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-timeout", "ruff", "pytest-cov", "build>=1", "twine", "mypy", "pre-commit", "pytest-playwright"]

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/harbor/_version.py"
write_to_template = "__version__ = \"{version}\"\n"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]



[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = [
    "*.egg-info",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long — handled by formatter / too noisy for stdlib style
    "B008",  # do not perform function calls in argument defaults — common in argparse
]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.mypy]
python_version = "3.9"
files = ["src/harbor"]
ignore_missing_imports = true
strict = false
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_defs = false
check_untyped_defs = false
# Progressive type-checking: start permissive, tighten over time as coverage improves.

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests requiring a running server and Playwright browser",
]
pythonpath = ["src"]

[tool.coverage.run]
source = ["harbor"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# Minimum total coverage required. CI will fail if coverage drops below this.
# Raise this bar gradually as test coverage improves.
fail_under = 70

[tool.coverage.html]
directory = "htmlcov"